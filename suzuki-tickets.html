const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFor(password,salt){
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(salt),iterations:ITER,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function unlock(){
 const p=document.getElementById('pw').value; const err=document.getElementById('error'); err.textContent='';
 if(!p){err.textContent='請輸入解鎖碼。';return}
 try{
   const urls=[];
   for(const x of blobs){const key=await keyFor(p,x.salt);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(x.iv)},key,b64(x.data));urls.push([x.label,URL.createObjectURL(new Blob([plain],{type:'image/png'}))]);}
   const el=document.getElementById('tickets');el.innerHTML=urls.map(([label,url])=>`<article class="ticket"><h2>${label}</h2><img src="${url}" alt="Suzuki 歷史館入場 QR"><p class="note">受付時出示此 QR</p></article>`).join('');el.classList.remove('hidden');
   document.getElementById('pw').value=''; window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
 }catch(e){err.textContent='解鎖碼不正確，請再試一次。';}
}
document.getElementById('go').addEventListener('click',unlock);document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
